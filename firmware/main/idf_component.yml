dependencies:
  idf: ">=5.3"

  lvgl/lvgl: "9.5.0"

  esp_video:
    version: "~2.0"
    public: true
  waveshare/esp32_p4_wifi6_touch_lcd_4_3:
    version: "==1.0.1"
  # v0.2 WiFi: P4 + C6 via SDIO, same pattern as Waveshare example 04_wifistation
  espressif/esp_wifi_remote:
    matches:
      - if: "idf_version >= 6.0"
        version: ">=1.6,<2.0"
      - if: "idf_version < 6.0"
        version: "0.14.*"
  espressif/esp_hosted:
    matches:
      - if: "idf_version >= 6.0"
        version: ">=2.12,<3.0"
      - if: "idf_version < 6.0"
        version: "1.4.*"
